<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Beast Training">
<meta name="description" content="Programa de hipertrofia de 8 semanas con registro de pesos y progreso.">
<title>Beast Training</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23101216'/%3E%3Crect x='8' y='20' width='8' height='24' rx='2' fill='%23E2483D'/%3E%3Crect x='48' y='20' width='8' height='24' rx='2' fill='%23E2483D'/%3E%3Crect x='16' y='24' width='5' height='16' rx='1' fill='%23F2C230'/%3E%3Crect x='43' y='24' width='5' height='16' rx='1' fill='%23F2C230'/%3E%3Crect x='21' y='30' width='22' height='4' fill='%23EEECE7'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}

:root{
  color-scheme:dark;
  --bg:#101216; --surface:#181B20; --surface2:#20242A; --line:#2B3037; --line2:#3A4049;
  --text:#EEECE7; --muted:#8C929B; --dim:#5E646D;
  --red:#E2483D; --blue:#3B7BEA; --yellow:#F2C230; --green:#33A56B;
  --accent:var(--yellow); --onaccent:#15130B;
  --good:#3FB977; --warn:#F2A23A; --bad:#EE5A4F;
  --display:"Big Shoulders Display","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:18px 56px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* HERO */
.hero{position:relative;border-radius:14px;overflow:hidden;padding:22px 20px 18px;background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),
  repeating-linear-gradient(-45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 7px),
  linear-gradient(160deg,#1E2228,#14171B);border:1px solid var(--line)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-family:var(--display);font-weight:900;font-size:clamp(56px,15vw,104px);line-height:.82;margin:10px 0 14px;letter-spacing:.005em;text-transform:uppercase}
.hero h1 span{color:var(--accent)}
.hero-row{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.hero-stat{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hero-stat b{color:var(--text);font-weight:600}
.plates{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:14px}
.plate{height:10px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.plate i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.plate.dl{background:repeating-linear-gradient(90deg,var(--line) 0 3px,var(--surface) 3px 6px)}
.plate-lbl{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:4px;font-family:var(--mono);font-size:10px;color:var(--dim);text-align:center}

/* TABS */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:14px 0 16px;padding:4px;background:rgba(16,18,22,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px}
.tab{border:0;background:transparent;padding:10px 4px;border-radius:8px;font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--onaccent)}

/* GENERIC */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbl{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;letter-spacing:.02em;text-transform:uppercase;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line2);background:var(--surface2);border-radius:8px;padding:10px 14px;font-weight:600;min-height:42px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.field{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
.field:focus{border-color:var(--accent);outline:none}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}

/* WEEK + DAY PICKERS */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;min-width:44px;height:40px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);position:relative}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--text);background:var(--surface2)}
.chip .now{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.chip.dl{font-style:italic}
.days{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.day{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:9px 8px 8px;text-align:left;position:relative;overflow:hidden;min-height:64px}
.day::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.day[aria-pressed="true"]{background:var(--surface2);border-color:var(--pc)}
.day .dn{font-family:var(--display);font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em;display:block;padding-left:4px}
.day .dd{font-family:var(--mono);font-size:10px;color:var(--muted);display:block;padding-left:4px;margin-top:2px}
.day .ok{position:absolute;top:7px;right:7px;color:var(--good);font-size:13px;font-weight:700}

.bwrow{display:grid;grid-template-columns:minmax(0,1fr) 96px auto;gap:8px;margin-top:8px}
@media (max-width:420px){.bwrow{grid-template-columns:minmax(0,1fr) 90px}.bwrow .btn{grid-column:1/-1}}
.phase{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center}
.phase .big{font-family:var(--display);font-weight:900;font-size:44px;line-height:.9;color:var(--accent);grid-row:span 2}

/* EXERCISES */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ex-h{padding:12px 14px 10px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.ex-n{font-family:var(--mono);font-size:12px;color:var(--dim);padding-top:2px;min-width:18px}
.ex-t{flex:1;min-width:0}
.ex-t h3{font-size:18px}
.ex-meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.ex-meta b{color:var(--text);font-weight:600}
.ex-tag{font-family:var(--mono);font-size:10px;padding:2px 6px;border-radius:4px;background:var(--surface2);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.hint{padding:9px 14px;font-size:13px;color:var(--muted);background:color-mix(in srgb,var(--pc) 7%,var(--surface));border-bottom:1px solid var(--line)}
.hint b{color:var(--text)}
.hint .tgt{font-family:var(--mono);color:var(--accent);font-weight:600}
.sets{padding:8px 14px 12px;display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 44px;gap:8px;align-items:center}
.set-h{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.set .n{font-family:var(--mono);color:var(--muted);font-size:13px;text-align:center}
.set input{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;text-align:center;padding:8px 6px}
.chk{height:42px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--dim);font-size:17px;font-weight:700}
.chk[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#06140C}
.cue{font-size:13px;color:var(--muted);padding:0 14px 12px}
.cue summary{cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);list-style:none}
.cue summary::-webkit-details-marker{display:none}
.cue p{margin-top:6px}

/* PROGRESS */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;margin-top:6px}
.kpi .v small{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .s{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
th:first-child,td:first-child{text-align:left}
td{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid label{display:flex;flex-direction:column;gap:4px}

/* ANALYSIS */
.verdict{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}.verdict:last-child{border-bottom:0}
.verdict .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-family:var(--mono)}
.verdict.good .ic{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.verdict.warn .ic{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.verdict.bad .ic{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.verdict.info .ic{background:var(--surface2);color:var(--muted)}
.verdict b{display:block;margin-bottom:2px}
.ai{white-space:pre-wrap;font-size:14.5px;line-height:1.55;max-width:68ch}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:8px 16px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}

/* GUIDE */
.guide p,.guide li{max-width:68ch;color:#D6D4CF}
.guide ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.refs li{font-size:13px;color:var(--muted)}
.sched{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.sched div{border-radius:6px;padding:8px 2px;font-family:var(--mono);font-size:11px;background:var(--surface2);color:var(--dim)}
.sched div.on{color:var(--text);background:color-mix(in srgb,var(--pc) 22%,var(--surface2));border:1px solid var(--pc)}

.sync{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;margin-top:18px;justify-content:center}
.sync .dot{width:6px;height:6px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.banner{border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-radius:var(--r);padding:10px 14px;font-size:13px}

@media (max-width:640px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .day .dn{font-size:14px}
  .tab{font-size:15px}
}


/* LOGIN */
.auth{max-width:440px;margin:18px auto 0}
.auth .seg{display:grid;width:100%;margin-bottom:12px}
.auth form{display:flex;flex-direction:column;gap:10px}
.auth label{display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:13.5px;min-height:1em}
/* TIEMPO */
.ss{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 6px;border-radius:5px;background:var(--pc);color:#0E1013;font-family:var(--mono);font-weight:700;font-size:11px}
.time{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:8px}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative;flex:1;min-width:140px}
.meter i{position:absolute;inset:0 auto 0 0;border-radius:4px}
.meter b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}
.timer{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(24,27,32,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line2);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.timer-in{max-width:880px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.timer .clock{font-family:var(--display);font-weight:900;font-size:40px;line-height:1;font-variant-numeric:tabular-nums;min-width:96px}
.timer .clock.over{color:var(--good)}
.timer .what{font-size:13px;color:var(--muted);line-height:1.3}
.timer .what b{color:var(--text);display:block;font-size:14px}
.timer .ctl{display:flex;gap:6px}
.timer .ctl .btn{min-height:38px;padding:6px 10px;font-family:var(--mono);font-size:13px}
.elapsed{font-family:var(--mono);font-size:12px;color:var(--muted)}
.elapsed b{color:var(--text)}
.wu{font-size:13.5px;color:var(--muted)}
.wu b{color:var(--text)}
body.timing .wrap{padding-bottom:120px}
@media (max-width:480px){.timer .clock{font-size:34px;min-width:80px}.timer-in{grid-template-columns:auto 1fr}.timer .ctl{grid-column:1/-1}.timer .ctl .btn{flex:1}}

</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="kicker" id="heroKicker">Hipertrofia · 8 semanas · Torso / Pierna × 2</div>
    <h1>Beast<br><span>Training</span></h1>
    <div class="hero-row" id="heroStats"></div>
    <div class="plates" id="plates"></div>
    <div class="plate-lbl"><span>S1</span><span>S2</span><span>S3</span><span>S4</span><span>S5</span><span>S6</span><span>S7</span><span>S8</span></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Secciones" hidden>
    <button class="tab" role="tab" id="t-train" data-tab="train">Entreno</button>
    <button class="tab" role="tab" id="t-prog" data-tab="prog">Progreso</button>
    <button class="tab" role="tab" id="t-ana" data-tab="ana">Análisis</button>
    <button class="tab" role="tab" id="t-guide" data-tab="guide">Guía</button>
  </nav>
  <main id="app"></main>
  <div class="sync" id="sync"></div>
</div>
<script>
/* ================= CONFIG ================= */
const API_URL = "https://script.google.com/macros/s/AKfycbySF9I7JFB5Bm60GqXgsOvPxzItT2llgkFs8CkZofdVpw-TGSxFcza6PksWERcO0RQ-/exec";
const MAX_MIN = 99; // 1 h 39 min
const WARMUP_MIN = 8;

/* ================= PROGRAMA ================= */
// rest = segundos de descanso DESPUÉS de cada serie de ese ejercicio. g = bloque (superserie / series alternas)
const DAYS_HIP=[
 {id:1,name:"Torso A",tag:"Fuerza-hipertrofia",pc:"var(--red)",ex:[
  {k:"bench",n:"Press banca con barra",s:4,r:[6,8],t:"c",g:"A1",rest:90,cue:"Escápulas atrás y abajo, pies firmes, baja controlado (2 s) hasta el esternón bajo y empuja explosivo."},
  {k:"bbrow",n:"Remo con barra",s:4,r:[6,8],t:"c",g:"A2",rest:90,cue:"Torso a ~45°, columna neutra. Tira hacia el ombligo y aprieta 1 s arriba. Sin impulso."},
  {k:"dbohp",n:"Press militar con mancuernas (sentado)",s:3,r:[8,10],t:"c",inc:2,unit:"kg/manc.",rest:120,cue:"Respaldo casi vertical. Baja hasta que las mancuernas rocen los hombros."},
  {k:"latpd",n:"Jalón al pecho agarre prono",s:3,r:[8,12],t:"i",rest:90,cue:"Pecho alto, codos hacia los bolsillos. Sube lento hasta estirar el dorsal."},
  {k:"latraise",n:"Elevaciones laterales con mancuernas",s:3,r:[12,15],t:"i",unit:"kg/manc.",rest:60,cue:"Codos ligeramente flexionados, sube hasta la altura del hombro guiando con el codo. Sin balanceo."},
  {k:"bbcurl",n:"Curl con barra (recta o EZ)",s:3,r:[8,12],t:"i",g:"C1",rest:10,cue:"Codos pegados, baja en 2–3 s hasta extender del todo."},
  {k:"ropepd",n:"Extensión de tríceps en polea con cuerda",s:3,r:[10,12],t:"i",g:"C2",rest:60,cue:"Codos fijos al costado, abre la cuerda abajo y aprieta 1 s."}]},
 {id:2,name:"Pierna A",tag:"Cuádriceps dominante",pc:"var(--blue)",ex:[
  {k:"squat",n:"Sentadilla trasera con barra",s:4,r:[6,8],t:"c",rest:180,cue:"Brace (aire + abdomen) antes de bajar. Rodillas siguen la punta del pie; baja al menos a paralelo."},
  {k:"rdl",n:"Peso muerto rumano",s:3,r:[8,10],t:"c",rest:150,cue:"Cadera atrás, barra pegada a las piernas, rodillas semiflexionadas. Baja hasta sentir estiramiento en isquios."},
  {k:"legpress",n:"Prensa de piernas",s:3,r:[10,12],t:"c",inc:5,rest:120,cue:"Rango completo sin despegar la zona lumbar del respaldo."},
  {k:"lyingcurl",n:"Curl femoral tumbado",s:3,r:[10,12],t:"i",g:"D1",rest:15,cue:"Cadera pegada al banco; negativa lenta."},
  {k:"standcalf",n:"Elevación de gemelos de pie",s:4,r:[10,15],t:"i",g:"D2",inc:2.5,rest:60,cue:"Pausa 1–2 s abajo en estiramiento y sube al máximo. Sin rebote."},
  {k:"cablecrunch",n:"Crunch en polea alta",s:3,r:[10,15],t:"i",rest:60,cue:"Lleva costillas a pelvis; la cadera no se mueve."}]},
 {id:3,name:"Torso B",tag:"Hipertrofia · volumen",pc:"var(--yellow)",ex:[

function lastPerf(k,w,d){
  const order=[];for(let W=1;W<=8;W++)for(let D=1;D<=DAYS.length;D++)order.push([W,D]);
  const idx=order.findIndex(([W,D])=>W===w&&D===d),curDl=!!WEEKS[w-1].deload;
  for(let i=idx-1;i>=0;i--){const[W,D]=order[i];if(!curDl&&WEEKS[W-1].deload)continue;
    const v=validSets(S.sessions[sid(W,D)]?.sets?.[k]);if(v.length)return{w:W,d:D,sets:v}}
  return null;
}
function suggest(ex,w,d){
  const lp=lastPerf(ex.k,w,d),W=WEEKS[w-1];
  if(!lp)return{html:w===1?"Primera vez: elige un peso con el que la última serie te deje <b>~3 reps en reserva</b>.":"Sin registro previo: empieza conservador y ajusta en la 2ª serie."};
  const top=Math.max(...lp.sets.map(s=>num(s.kg)));const reps=lp.sets.filter(s=>num(s.kg)===top).map(s=>num(s.reps));
  const inc=ex.inc??(ex.t==="c"?2.5:1);let kg=top,why;
  if(W.deload){kg=r05(top*0.9);why="descarga −10%"}
  else if(reps.every(r=>r>=ex.r[1])){kg=top+inc;why=`hiciste ${ex.r[1]}+ en todas → +${fmt(inc)} kg`}
  else if(reps.some(r=>r<ex.r[0])){why=`bajo el rango → mismo peso, busca ${ex.r[0]}+`}
  else why="mismo peso, +1 rep por serie";
  return{html:`Última (S${lp.w}): <b class="mono">${fmt(top)} kg × ${reps.join(", ")}</b> · Hoy: <span class="tgt">${fmt(kg)} kg</span> <span class="muted">(${why})</span>`,kg};
}
function weekStats(w){

  for(let d=1;d<=DAYS.length;d++){const s=S.sessions[sid(w,d)];if(!s)continue;if(s.done)done++;let any=false;
    for(const k in(s.sets||{}))for(const x of validSets(s.sets[k])){sets++;any=true;ton+=num(x.kg)*num(x.reps)}

  const bws=bwInRange(weekStart(w),addDays(weekStart(w),6));

  const xs=win.map(x=>diffDays(win[0].date,x.date)),ys=win.map(x=>x.kg),mx=avg(xs),my=avg(ys),den=xs.reduce((s,x)=>s+(x-mx)**2,0);if(!den)return null;return xs.reduce((s,x,i)=>s+(x-mx)*(ys[i]-my),0)/den*7}
function nutrition(){
  const c=cfg(),w=num(c.startWeight)||75,h=num(c.height)||175,a=num(c.age)||30;

}
function rateStatus(rate,gain){

  if(gaining)return rate<gain[0]*0.8?"warn":rate>gain[1]*1.1?"bad":"good";
  if(rate>0)return "warn";
  const r=Math.abs(rate),lo=Math.abs(gain[1]),hi=Math.abs(gain[0]);  return r<lo*0.8?"warn":r>hi*1.1?"bad":"good";
}

async function api(action,payload){
  if(GAS){const txt=await new Promise((ok,ko)=>google.script.run.withSuccessHandler(ok).withFailureHandler(e=>ko(new Error(e&&e.message||"Sin conexión con Google"))).apiCall(JSON.stringify(Object.assign({action},payload))));
    const j=JSON.parse(txt);if(!j.ok)throw new Error(j.error||"Error del servidor");return j}
  const url=apiUrl();if(!url)throw new Error("Base de datos no configurada");
  const res=await fetch(url,{method:"POST",body:JSON.stringify(Object.assign({action},payload)),redirect:"follow"});
  const j=await res.json();if(!j.ok)throw new Error(j.error||"Error del servidor");return j;
}
const cacheKey=()=>"bt-cache-"+(AUTH?.name||"").toLowerCase();
function cacheSave(){LS.set(cacheKey(),{S,PROFILE})}
let queue=LS.get("bt-queue",{}),timers={},flushing=false;
function queueSave(coll,id,delay=900){
  queue[coll+"/"+id]={coll,id,v:Date.now()+Math.random()};LS.set("bt-queue",queue);cacheSave();setSync("pending");
  clearTimeout(timers.flush);timers.flush=setTimeout(flush,delay);
}
function flatFor(id){const s=S.sessions[id];if(!s)return null;const w=s.w,d=s.d,rows=[];
  DAYS[d-1].ex.forEach(ex=>validSets(s.sets?.[ex.k]).forEach((x,i)=>rows.push({semana:w,dia:DAYS[d-1].name,fecha:sessionDate(w,d),ejercicio:ex.n,serie:i+1,kg:num(x.kg),reps:num(x.reps)})));
  return{wd:w+"|"+DAYS[d-1].name,rows}}
async function flush(){
  if(flushing||!AUTH)return;flushing=true;clearTimeout(timers.retry);timers.retry=null;
  try{
    for(const key of Object.keys(queue)){
      const{coll,id,v}=queue[key];const data=S[COLL[coll]][id];
      if(data==null)await api("delete",{...AUTH,coll,id});
      else await api("set",{...AUTH,coll,id,data,flat:coll==="sessions"?flatFor(id):undefined});
      if(queue[key]&&queue[key].v===v)delete queue[key];LS.set("bt-queue",queue);
    }
    setSync("ok");
  }catch(e){setSync("err",navigator.onLine?("No se pudo guardar en Drive: "+e.message+". Reintentando…"):"Sin conexión: guardado en el móvil, se subirá al volver la red");clearTimeout(timers.retry);timers.retry=setTimeout(flush,20000)}
  finally{flushing=false;if(Object.keys(queue).length&&!timers.retry)setTimeout(flush,1500)}
}
window.addEventListener("online",()=>flush());
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&AUTH){if(Object.keys(queue).length)flush();else refresh(true)}});
function setSync(state,msg){
  const el=$("#sync");if(!el)return;
  const map={ok:["var(--good)","Guardado en Google Drive"],pending:["var(--warn)","Guardando…"],err:["var(--bad)",msg||"Error al guardar"],loading:["var(--dim)","Cargando…"]};
  const[c,t]=map[state]||map.ok;el.innerHTML=`<span class="dot" style="color:${c}"></span><span>${esc(t)}</span>${AUTH?` · <span>${esc(AUTH.name)}</span>`:""}`;
}
let toastT;function toast(t){let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";document.body.appendChild(el)}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400)}
function applyDocs(docs){const next={sessions:{},bw:{},measures:{},cfg:{}};for(const d of docs){const k=COLL[d.coll];if(k)next[k][d.id]=d.data}
  for(const key in queue){const{coll,id}=queue[key];const k=COLL[coll];if(S[k][id]!==undefined)next[k][id]=S[k][id]}
  Object.assign(S,next)}
async function refresh(silent){
  try{const j=await api("login",AUTH);PROFILE=j.profile;AUTH.name=j.name;applyDocs(j.docs);cacheSave();if(!Object.keys(queue).length)setSync("ok");softRender()}
  catch(e){if(!silent)setSync("err","No se pudo cargar desde Drive: "+e.message)}
}

function inputFocused(){const a=document.activeElement;return a&&$("#app").contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)}
function softRender(){if(inputFocused()){dirty=true;return}render()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(dirty&&!inputFocused()){dirty=false;render()}},60));
function render(){
  const wantProg=(PROFILE&&PROFILE.programa)||"hipertrofia";
  if(wantProg!==PROG)applyProgram(wantProg);
  const tabs=$(".tabs");
  if(!apiUrl()){tabs.hidden=true;$("#app").innerHTML=renderSetup();renderHero();return}
  if(!AUTH){tabs.hidden=true;$("#app").innerHTML=renderAuth();renderHero();return}
  tabs.hidden=false;
  if(ui.week==null){ui.week=curWeek();const t=isoToday();let pick=DAYS.length;for(let d=1;d<=DAYS.length;d++){if(sessionDate(ui.week,d)>=t){pick=d;break}}ui.day=pick}
  renderHero();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===ui.tab)));
  $("#app").innerHTML=ui.tab==="train"?renderTrain():ui.tab==="prog"?renderProg():ui.tab==="ana"?renderAna():renderGuide();
  renderTimer();
}

function renderEx(ex,i,w,d,s,day){

    rows+=`<div class="set"><span class="n">${j+1}</span>
      <input class="field" id="kg-${ex.k}-${j}" inputmode="decimal" aria-label="Kg serie ${j+1}" data-e="${ex.k}" data-i="${j}" data-f="kg" value="${esc(x.kg??"")}" placeholder="${esc(ph)}">
      <input class="field" id="rp-${ex.k}-${j}" inputmode="numeric" aria-label="Reps serie ${j+1}" data-e="${ex.k}" data-i="${j}" data-f="reps" value="${esc(x.reps??"")}" placeholder="${ex.r[0]}–${ex.r[1]}">
      <button class="chk" data-act="chk" data-e="${ex.k}" data-i="${j}" aria-pressed="${!!x.ok}" aria-label="Serie ${j+1} hecha">✓</button></div>`}
  const label=ex.g?`<span class="ss">${ex.g}</span>`:`<span class="ex-n">${String(i+1).padStart(2,"0")}</span>`;
  const blk=ex.g&&ex.g.endsWith("1")?`<div class="hint" style="background:var(--surface2)">${ex.t==="c"?"<b>Series alternas:</b> haz una serie de "+ex.g[0]+"1, descansa, una de "+ex.g[0]+"2, descansa y repite. Mismo estímulo, ~30% menos tiempo.":"<b>Superserie:</b> "+ex.g[0]+"1 y "+ex.g[0]+"2 seguidos, luego descansa. Músculos distintos, así que no pierdes rendimiento."}</div>`:"";
  return `<article class="ex" style="--pc:${day.pc}">
   <div class="ex-h">${label}<div class="ex-t"><h3>${esc(ex.n)}</h3>
     <div class="ex-meta"><span><b>${n}</b> × <b>${ex.r[0]}–${ex.r[1]}</b></span><span>RIR <b>${WEEKS[w-1].rir}</b></span><span>Descanso <b>${restLabel(ex,day)}</b></span></div></div>     <span class="ex-tag">${ex.t==="c"?"Básico":"Aislado"}</span></div>

}

/* ---- TEMPORIZADOR DE DESCANSO ---- */
let rest=null,tick=null,audioCtx=null;
function startRest(ex){
  rest={end:Date.now()+ex.rest*1000,total:ex.rest,name:ex.n,next:ex.g&&ex.g.endsWith("1")?"Ahora "+ex.g[0]+"2":ex.g?"Vuelve a "+ex.g[0]+"1":"Siguiente serie",beeped:false};
  try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}
  if(ex.rest<=20){rest=null;renderTimer();toast("Sin pausa → "+(ex.g?ex.g[0]+"2":"siguiente"));return}
  renderTimer();
}
function beep(){try{if(!audioCtx)return;[0,0.25,0.5].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;g.gain.value=0.15;o.connect(g);g.connect(audioCtx.destination);o.start(audioCtx.currentTime+t);o.stop(audioCtx.currentTime+t+0.15)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function renderTimer(){
  let el=$("#timer");
  if(!rest||ui.tab!=="train"||!AUTH){if(el)el.remove();document.body.classList.remove("timing");clearInterval(tick);tick=null;return}
  if(!el){el=document.createElement("div");el.id="timer";el.className="timer";document.body.appendChild(el);
    el.innerHTML=`<div class="timer-in"><div class="clock" id="tClock"></div><div class="what" id="tWhat"></div><div class="ctl"><button class="btn" data-act="t-minus">−15</button><button class="btn" data-act="t-plus">+15</button><button class="btn" data-act="t-skip">Listo</button></div></div>`}
  document.body.classList.add("timing");
  const upd=()=>{if(!rest)return;const left=(rest.end-Date.now())/1000;const c=$("#tClock");if(!c)return;
    c.textContent=left>=0?mmss(left):"+"+mmss(-left);c.classList.toggle("over",left<0);
    $("#tWhat").innerHTML=`<b>${left>=0?"Descanso":"¡A por la serie!"}</b>${esc(rest.next)} · ${esc(rest.name.split(" (")[0])}`;
    if(left<0&&!rest.beeped){rest.beeped=true;beep()}
    if(left<-90){rest=null;renderTimer()}
    const en=$("#elapsedNow");if(en){const s=getSess(ui.week,ui.day);if(s.startedAt&&!s.done)en.textContent=hm((Date.now()-Date.parse(s.startedAt))/60000)}};
  upd();if(!tick)tick=setInterval(upd,500);
}

    <div class="kpi"><div class="lbl">Sesiones</div><div class="v">${done}<small>/${8*DAYS.length}</small></div><div class="s">S${cw}: ${fmt(weekStats(cw).ton/1000,1)} t de volumen</div></div>
   </div>
   <div class="card chart"><div class="row" style="justify-content:space-between"><h3>Peso corporal</h3><span class="lbl">diario · media semanal</span></div>${bwChart()}

function svgFrame(W,H,pad,yMin,yMax,xMin,xMax,yTicks,xTicks,yF){
  const X=x=>pad.l+(x-xMin)/(xMax-xMin||1)*(W-pad.l-pad.r),Y=y=>H-pad.b-(y-yMin)/(yMax-yMin||1)*(H-pad.t-pad.b);let g="";
  yTicks.forEach(t=>{g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)"/><text x="${pad.l-8}" y="${Y(t)+4}" text-anchor="end" fill="var(--muted)" font-size="11" font-family="IBM Plex Mono, monospace">${yF(t)}</text>`});
  xTicks.forEach(([x,l])=>{g+=`<text x="${X(x)}" y="${H-pad.b+18}" text-anchor="middle" fill="var(--muted)" font-size="11" font-family="IBM Plex Mono, monospace">${l}</text>`});
  return{X,Y,g};
}
function niceTicks(min,max,n=4){const step0=(max-min||1)/n,mag=10**Math.floor(Math.log10(step0)),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0),t=[];for(let v=Math.ceil(min/step)*step;v<=max+1e-9;v+=step)t.push(+v.toFixed(6));return t}

function monthData(m){
  const ws=m===1?[1,2,3,4]:[5,6,7,8];
  const done=ws.reduce((s,w)=>s+weekStats(w).done,0),logged=ws.reduce((s,w)=>s+weekStats(w).logged,0);
  const startBw=m===1?baselineBw():(weekStats(4).bwAvg??weekStats(3).bwAvg??baselineBw());
  let endW=null;for(const w of [...ws].reverse())if(weekStats(w).bwAvg!=null){endW=w;break}
  const endBw=endW?weekStats(endW).bwAvg:null,weeksEl=endW?(endW-(m===1?0:4)):null;
  const bwDelta=endBw!=null?endBw-startBw:null,bwRate=bwDelta!=null&&weeksEl?bwDelta/weeksEl:null;
  const lifts=MAIN_LIFTS.map(k=>{const p=ws.map(w=>[w,bestE1(k,w)]).filter(x=>x[1]&&!WEEKS[x[0]-1].deload);if(p.length<2)return null;
    return{k,n:ALL_EX[k].n.split(" (")[0],a:p[0][1],b:p[p.length-1][1],pct:(p[p.length-1][1]/p[0][1]-1)*100}}).filter(Boolean);
  const avgPct=lifts.length?avg(lifts.map(l=>l.pct)):null,tons=ws.map(w=>weekStats(w).ton);
  const mA=S.measures[m===1?"m0":"m1"]||{},mB=S.measures[m===1?"m1":"m2"]||{},md={};
  ["waist","chest","arm","thigh"].forEach(f=>{const a=num(mA[f]),b=num(mB[f]);if(a!=null&&b!=null)md[f]=b-a});
  const durs=ws.flatMap(w=>Array.from({length:DAYS.length},(_,i)=>i+1).map(d=>S.sessions[sid(w,d)])).filter(s=>s?.startedAt&&s?.doneAt).map(s=>(Date.parse(s.doneAt)-Date.parse(s.startedAt))/60000).filter(x=>x>5&&x<240);
  return{m,ws,done,logged,startBw,endBw,bwDelta,bwRate,lifts,avgPct,tons,md,durs};
}

     <li><b>Proteína:</b> 4–5 tomas de 30–40 g. Fuentes: pollo, pavo, ternera, huevos, legumbres, tofu y proteína en polvo (whey o vegetal si no tomas lácteos).</li>
     <li><b>Alrededor del entreno:</b> comida con proteína y carbohidratos 1–3 h antes y otra después.</li>
     <li><b>Creatina monohidrato:</b> 3–5 g al día. Es el suplemento con más evidencia para fuerza y masa muscular.</li>
     <li><b>Sueño:</b> 7–9 h.</li>
    </ul></div>
   <div class="card stack"><h2>Base científica</h2>
    <ul class="refs">
     <li>Schoenfeld, Ogborn &amp; Krieger (2016). Frecuencia de entrenamiento e hipertrofia. <i>Sports Medicine</i> — 2×/semana por músculo supera a 1×.</li>
     <li>Schoenfeld, Ogborn &amp; Krieger (2017). Dosis-respuesta del volumen semanal. <i>J Sports Sci</i> — ≥10 series/semana por músculo.</li>
     <li>Schoenfeld et al. (2021). Loading recommendations for strength, hypertrophy and endurance. <i>Sports</i>.</li>
     <li>Refalo et al. (2023). Proximidad al fallo e hipertrofia. <i>Sports Medicine</i> — 0–3 RIR es suficiente.</li>
     <li>Zourdos et al. (2016). Escala RPE basada en RIR. <i>J Strength Cond Res</i>.</li>
     <li>Robbins et al. (2010). Series agonista-antagonista alternas: igual volumen en menos tiempo. <i>J Strength Cond Res</i>.</li>
     <li>Iversen et al. (2021). No time to lift? Estrategias de entrenamiento eficientes en tiempo. <i>Sports Medicine</i>.</li>
     <li>Morton et al. (2018). Proteína y masa muscular: meta-análisis. <i>Br J Sports Med</i>.</li>
     <li>Iraki et al. (2019). Nutrición para culturistas fuera de temporada. <i>Sports</i> — ganancia de 0,25–0,5% del peso/semana.</li>
     <li>Kreider et al. (2017). ISSN position stand: creatine. <i>JISSN</i>.</li>
     ${PROG==="recomp"?`<li>Tanaka, Monahan &amp; Seals (2001). FC máx. estimada por edad (208 − 0,7 × edad). <i>J Am Coll Cardiol</i>.</li>
     <li>Gulati et al. (2010). Fórmula de FC máx. específica para mujeres (206 − 0,88 × edad). <i>Circulation</i>.</li>
     <li>San-Millán &amp; Brooks (2018). Entrenamiento de baja intensidad (zona 2) y oxidación de grasa. <i>Sports Medicine</i>.</li>
     <li>Cardio de baja intensidad tipo caminata inclinada: bajo impacto articular y apenas interfiere con la recuperación de la fuerza, a diferencia de correr o el HIIT.</li>`:""}
    </ul></div>
   <div class="card stack"><h3>Mi perfil</h3>
    <div class="mgrid">
     <label><span class="lbl">Inicio (lunes)</span><input class="field mono" type="date" id="cfgStart" value="${esc(c.startDate)}"></label>
     <label><span class="lbl">Peso inicial (kg)</span><input class="field mono" id="cfgW" inputmode="decimal" value="${esc(c.startWeight)}"></label>
     <label><span class="lbl">Altura (cm)</span><input class="field mono" id="cfgH" inputmode="numeric" value="${esc(c.height)}"></label>
     <label><span class="lbl">Edad</span><input class="field mono" id="cfgA" inputmode="numeric" value="${esc(c.age)}"></label>
     <label><span class="lbl">Sexo</span><select class="field" id="cfgS"><option value="h" ${c.sex!=="m"?"selected":""}>Hombre</option><option value="m" ${c.sex==="m"?"selected":""}>Mujer</option></select></label>
     <div style="display:flex;align-items:flex-end"><button class="btn primary" data-act="cfg-save" style="width:100%">Guardar perfil</button></div>
    </div>
    <div class="row"><button class="btn ghost" data-act="logout">Cerrar sesión en este dispositivo</button></div></div>
  </div>`;
}

/* ================= EVENTOS ================= */
function ensureSess(w,d){const id=sid(w,d);if(!S.sessions[id])S.sessions[id]={w,d,date:sessionDate(w,d),sets:{},done:false,note:""};const s=S.sessions[id];s.sets=s.sets||{};return s}
function markStart(s){if(!s.startedAt){s.startedAt=new Date().toISOString();return true}return false}
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-tab],[data-act]");if(!t)return;
  if(t.dataset.tab){ui.tab=t.dataset.tab;saveUi();render();window.scrollTo({top:0});return}
  const a=t.dataset.act,w=ui.week,d=ui.day;
  if(a==="auth-mode"){ui.authMode=t.dataset.v;render();return}
  if(a==="api-save"){const v=$("#apiIn").value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(v)){$("#authErr").textContent="La URL debe empezar por https://script.google.com/";return}LS.set("bt-api",v);render();return}
  if(a==="week"){ui.week=+t.dataset.v;render();return}
  if(a==="day"){ui.day=+t.dataset.v;render();return}
  if(a==="month"){ui.month=+t.dataset.v;render();return}
  if(a==="t-plus"&&rest){rest.end+=15000;rest.beeped=false;return}
  if(a==="t-minus"&&rest){rest.end-=15000;return}
  if(a==="t-skip"){rest=null;renderTimer();return}
  if(a==="chk"){const s=ensureSess(w,d),k=t.dataset.e,i=+t.dataset.i;s.sets[k]=(s.sets[k]||[]).slice();for(let j=0;j<=i;j++)if(!s.sets[k][j])s.sets[k][j]={};
    s.sets[k][i]=Object.assign({},s.sets[k][i]);const on=!s.sets[k][i].ok;s.sets[k][i].ok=on;
    if(on){const kgI=$(`#kg-${k}-${i}`);if(kgI&&!kgI.value&&kgI.placeholder){s.sets[k][i].kg=kgI.placeholder;kgI.value=kgI.placeholder}
      const started=markStart(s);startRest(ALL_EX[k]&&DAYS[d-1].ex.find(x=>x.k===k)||ALL_EX[k]);if(started)softRender()}
    t.setAttribute("aria-pressed",String(on));queueSave("sessions",sid(w,d),1500);return}
  if(a==="done"){const s=ensureSess(w,d);s.done=!s.done;if(s.done){markStart(s);s.doneAt=new Date().toISOString();rest=null}else s.doneAt=null;queueSave("sessions",sid(w,d),50);render();toast(s.done?"Sesión completada":"Sesión reabierta");return}
  if(a==="bw-save"){const date=$("#bwDate").value||isoToday(),kg=num($("#bwKg").value);if(kg==null||kg<30||kg>250){toast("Introduce un peso válido en kg");return}
    S.bw[date]={date,kg};queueSave("bw",date,50);toast(`Peso guardado: ${fmt(kg,2)} kg`);renderHero();return}
  if(a==="cfg-save"){PROFILE=Object.assign({},PROFILE,{startDate:$("#cfgStart").value||cfg().startDate,startWeight:num($("#cfgW").value)||cfg().startWeight,height:num($("#cfgH").value)||cfg().height,age:num($("#cfgA").value)||cfg().age,sex:$("#cfgS").value});
    cacheSave();ui.week=null;render();try{await api("profile",{...AUTH,profile:PROFILE});toast("Perfil guardado")}catch(err){toast("No se pudo guardar el perfil: "+err.message)}return}
  if(a==="logout"){LS.del("bt-auth");AUTH=null;PROFILE=null;Object.assign(S,{sessions:{},bw:{},measures:{},cfg:{}});rest=null;render();return}
});
document.addEventListener("submit",async e=>{
  if(e.target.id!=="authForm")return;e.preventDefault();
  const name=$("#aName").value.trim(),pin=$("#aPin").value.trim(),err=$("#authErr"),btn=$("#aBtn");err.textContent="";
  if(!/^\d{4,6}$/.test(pin)){err.textContent="El PIN debe tener entre 4 y 6 números.";return}
  btn.disabled=true;btn.textContent="Conectando…";
  try{
    let j;
    if(ui.authMode==="reg"){const profile={sex:$("#aSex").value,age:num($("#aAge").value),height:num($("#aH").value),startWeight:num($("#aW").value),startDate:$("#aStart").value||nextMonday(),programa:$("#aProg")?.value||"hipertrofia"};
      if(!profile.age||!profile.height||!profile.startWeight)throw new Error("Completa edad, altura y peso.");
      j=await api("register",{name,pin,profile})}
    else j=await api("login",{name,pin});
    AUTH={name:j.name,pin};PROFILE=j.profile;LS.set("bt-auth",AUTH);queue={};LS.set("bt-queue",queue);
    Object.assign(S,{sessions:{},bw:{},measures:{},cfg:{}});applyDocs(j.docs);cacheSave();ui.week=null;ui.tab="train";render();setSync("ok");
    if(ui.authMode==="reg")toast("Perfil creado. ¡A entrenar!");
  }catch(ex){err.textContent=ex.message==="Failed to fetch"?"No se pudo conectar. Revisa tu conexión.":ex.message;btn.disabled=false;btn.textContent=ui.authMode==="reg"?"Crear perfil y empezar":"Entrar"}
});
document.addEventListener("input",e=>{
  const t=e.target;if(!AUTH)return;
  if(t.dataset.f){const s=ensureSess(ui.week,ui.day),k=t.dataset.e,i=+t.dataset.i;s.sets[k]=(s.sets[k]||[]).slice();for(let j=0;j<=i;j++)if(!s.sets[k][j])s.sets[k][j]={};
    s.sets[k][i]=Object.assign({},s.sets[k][i],{[t.dataset.f]:t.value.trim()});queueSave("sessions",sid(ui.week,ui.day),1500);return}
  if(t.dataset.note){const s=ensureSess(ui.week,ui.day);s.note=t.value;queueSave("sessions",sid(ui.week,ui.day),1500);return}
  if(t.dataset.m){const m=t.dataset.m;S.measures[m]=Object.assign({},S.measures[m]||{},{[t.dataset.mf]:t.value.trim()});queueSave("measures",m,1500);return}
});
document.addEventListener("change",e=>{
  if(e.target.id==="exSel"){ui.exSel=e.target.value;saveUi();render()}
  if(e.target.id==="bwDate"){ui.bwDate=e.target.value;const b=S.bw[ui.bwDate];$("#bwKg").value=b?fmt(num(b.kg),2):""}
});

/* ================= ARRANQUE ================= */
(function boot(){
  AUTH=LS.get("bt-auth",null);
  if(AUTH){const c=LS.get(cacheKey(),null);if(c){Object.assign(S,c.S||{});PROFILE=c.PROFILE||null}}
  render();
  if(AUTH&&apiUrl()){setSync(Object.keys(queue).length?"pending":"loading");if(Object.keys(queue).length)flush().then(()=>refresh(true));else refresh()}
  else setSync("ok");
})();

</script>
</body>
